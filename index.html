<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Ratio Calculator</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-lg">
                    <div class="card-header text-white text-center">
                        <h1 class="mb-0">☕ Coffee Ratio Calculator</h1>
                    </div>
                    <div class="card-body p-4">
                        <form id="coffeeForm">
                            <div class="mb-4">
                                <label for="ratio" class="form-label fw-bold">Coffee Ratio</label>
                                <input type="number" class="form-control form-control-lg" id="ratio" 
                                       placeholder="Enter ratio (e.g., 17)" value="17" step="0.1" min="1" required>
                                <small class="form-text text-muted">The ratio of water to coffee beans</small>
                            </div>
                            
                            <div class="mb-4">
                                <label for="amountWanted" class="form-label fw-bold">Amount Wanted (ml)</label>
                                <input type="number" class="form-control form-control-lg" id="amountWanted" 
                                       placeholder="Enter amount in ml (e.g., 300)" value="300" step="1" min="1" required>
                                <small class="form-text text-muted">Total coffee amount you want to brew</small>
                            </div>

                            <fieldset class="mb-4">
                                <legend class="form-label fw-bold fs-6">Iced coffee?</legend>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="coffeeStyle" id="notIced" value="not-iced" checked>
                                    <label class="form-check-label" for="notIced">Nah</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="coffeeStyle" id="iced" value="iced">
                                    <label class="form-check-label" for="iced">Iced</label>
                                </div>
                            </fieldset>
                            
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg">
                                    Calculate
                                </button>
                            </div>
                        </form>
                        
                        <div id="results" class="mt-4 d-none">
                            <hr>
                            <h5 class="text-center mb-3">Results</h5>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <div class="card bg-light">
                                        <div class="card-body text-center">
                                            <h6 class="card-subtitle mb-2" style="color: #999;">Beans Needed</h6>
                                            <h3 class="card-title text-primary" id="beansResult">0g</h3>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-6 d-none" id="iceResultCard">
                                    <div class="card bg-light">
                                        <div class="card-body text-center">
                                            <h6 class="card-subtitle mb-2" style="color: #999;">Ice Needed</h6>
                                            <h3 class="card-title text-info" id="iceResult">0ml</h3>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-6 d-none" id="hotWaterResultCard">
                                    <div class="card bg-light">
                                        <div class="card-body text-center">
                                            <h6 class="card-subtitle mb-2" style="color: #999;">Hot Water Needed</h6>
                                            <h3 class="card-title text-warning" id="hotWaterResult">0ml</h3>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="card bg-light">
                                        <div class="card-body text-center">
                                            <h6 class="card-subtitle mb-2" style="color: #999;">Water Needed</h6>
                                            <h3 class="card-title text-success" id="waterResult">0ml</h3>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="mt-3">
                                <div class="alert alert-info text-center" id="summaryResult"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
